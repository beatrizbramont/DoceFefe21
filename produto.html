<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <!--
    SEO: título e descrição são ajustados por js/produto.js assim que o
    produto carrega. Estes valores são o ponto de partida.
  -->
  <title>Detalhes do Produto | Doce Fefê.21</title>
  <meta name="description" content="Ingredientes, peso, fotos e informações completas do doce artesanal escolhido.">

  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Doce Fefê.21">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="./assets/images/logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/jpeg" href="./assets/images/logo.jpeg">
  <link rel="apple-touch-icon" href="./assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="stylesheet" href="./css/produtos.css">
</head>

<body>
  <div id="cabecalho"></div>

  <main id="conteudo">

    <div class="container">
      <nav aria-label="Você está aqui">
        <ol class="migalhas">
          <li><a href="./index.html">Início</a></li>
          <li><a href="./produtos.html">Nossos Doces</a></li>
          <li><a href="./produtos.html" data-migalha-categoria></a></li>
          <li><span aria-current="page" data-migalha-produto>Carregando…</span></li>
        </ol>
      </nav>
    </div>

    <!-- ===== Carregando ===== -->
    <div class="container" data-carregando-produto>
      <div class="produto-detalhe" style="padding-block: var(--esp-6)">
        <div class="esqueleto" style="aspect-ratio:1; border-radius:var(--raio-xl)"></div>
        <div class="flex flex-coluna gap-4">
          <div class="esqueleto esqueleto-linha esqueleto-linha--curta"></div>
          <div class="esqueleto esqueleto-linha esqueleto-linha--titulo" style="height:34px"></div>
          <div class="esqueleto esqueleto-linha"></div>
          <div class="esqueleto esqueleto-linha"></div>
          <div class="esqueleto esqueleto-linha esqueleto-linha--curta"></div>
        </div>
      </div>
    </div>

    <!-- ===== Erro / produto não encontrado ===== -->
    <div class="container" data-erro-produto hidden></div>

    <!-- ===== Produto ===== -->
    <article class="container" data-conteudo-produto hidden>
      <div class="produto-detalhe" style="padding-block: var(--esp-6)">

        <!-- ----- Galeria ----- -->
        <div data-galeria></div>

        <!-- ----- Informações ----- -->
        <div class="produto-info">

          <!-- Aviso de produto de demonstração. Some automaticamente quando
               os produtos reais forem cadastrados. -->
          <div class="aviso-demonstracao" data-aviso-demonstracao hidden>
            <span data-icone="alerta" aria-hidden="true"></span>
            <p class="sem-margem">
              <strong>Produto de demonstração.</strong>
              Nome, preço e peso são exemplos para visualizar o site.
            </p>
          </div>

          <span class="produto-info__categoria" data-produto-categoria></span>
          <h1 class="produto-info__nome" data-produto-nome></h1>

          <div class="produto-info__selos" data-produto-selos></div>

          <div class="produto-info__preco" data-produto-preco></div>

          <p class="disponibilidade mb-6" data-produto-disponibilidade></p>

          <p class="produto-info__descricao" data-produto-descricao></p>

          <!-- ----- Compra ----- -->
          <div class="produto-compra" data-area-compra>
            <div data-seletor-quantidade></div>

            <!-- Fica oculto até o produto carregar, para não aparecer um
                 botão sem produto associado. -->
            <button type="button" class="btn btn--primario btn--grande"
                    data-adicionar-carrinho hidden>
              Adicionar ao carrinho
            </button>

            <!-- O WhatsApp continua como caminho direto: é assim que a
                 marca já atende hoje. -->
            <a href="#" class="btn btn--whatsapp btn--grande"
               data-pedir-whatsapp target="_blank" rel="noopener noreferrer">
              Pedir pelo WhatsApp
            </a>
          </div>

          <p class="texto-pequeno texto-suave mb-8" style="max-width:none">
            Total:
            <strong class="texto-dourado" data-total-pedido>—</strong>
            · <a href="./carrinho.html">Ver carrinho</a></p>

        </div>
      </div>
    </article>

    <!-- ===== Produtos relacionados ===== -->
    <section class="secao secao--creme" data-secao-relacionados hidden>
      <div class="container">
        <div class="secao__cabecalho secao__cabecalho--centro">
          <span class="sobretitulo">Você também pode gostar</span>
          <h2>Da mesma linha</h2>
          <span class="filete-dourado filete-dourado--centro"></span>
        </div>

        <div class="grade grade--4" data-relacionados></div>
      </div>
    </section>

  </main>

  <div id="rodape"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/produto.js"></script>
</body>
</html>
