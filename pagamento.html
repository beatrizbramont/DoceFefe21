<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Pagamento | Doce Fefê.21</title>
  <meta name="description" content="Escolha como pagar seu pedido na Doce Fefê.21.">

  <!-- Página de pagamento: nunca deve aparecer em buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="./assets/images/logo.jpeg">
  <link rel="apple-touch-icon" href="./assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/footer.css">
  <!-- Reaproveita .preco e .resumo__* das telas de carrinho e checkout. -->
  <link rel="stylesheet" href="./css/produtos.css">
  <link rel="stylesheet" href="./css/carrinho.css">
  <link rel="stylesheet" href="./css/checkout.css">
  <link rel="stylesheet" href="./css/pagamento.css">
</head>

<body>
  <div id="cabecalho"></div>

  <main id="conteudo">

    <section class="capa-pagina">
      <div class="container">
        <h1>Pagamento</h1>
        <p class="subtitulo">Seu pedido está registrado. Falta combinar o pagamento.</p>
      </div>
    </section>

    <section class="secao">
      <div class="container">
        <div class="checkout-layout">

          <!-- Conteúdo do pagamento, montado por js/pagamento.js -->
          <div data-pagamento>
            <div class="pagamento-passo">
              <p class="texto-suave texto-centro">Carregando seu pedido…</p>
            </div>
          </div>

          <!-- Resumo do pedido -->
          <aside class="checkout-resumo" aria-label="Resumo do pedido"
                 data-resumo-pagamento></aside>

        </div>
      </div>
    </section>

  </main>

  <div id="rodape"></div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/pagamento.js"></script>
</body>
</html>
