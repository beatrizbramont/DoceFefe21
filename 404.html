<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Página não encontrada | Doce Fefê.21</title>
  <meta name="description" content="Esta página não existe. Veja nossos doces ou fale com a gente.">

  <!--
    Página de erro não deve ser indexada: ela não é conteúdo, é um desvio.
    Sem isto, o buscador acabaria mostrando "Página não encontrada" como
    resultado de busca pela marca.
  -->
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/jpeg" href="./assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
  <div id="cabecalho"></div>

  <main id="conteudo">
    <section class="secao">
      <div class="container">

        <!--
          O caminho de volta importa mais que o pedido de desculpas.

          Quem cai aqui errou um endereço ou clicou num link velho — e a
          única coisa útil é oferecer para onde ir. Por isso os três botões
          cobrem as três intenções possíveis: comprar, conhecer, perguntar.
        -->
        <div class="pagina-erro">
          <p class="pagina-erro__numero" aria-hidden="true">404</p>

          <h1 class="pagina-erro__titulo">Esta página não existe</h1>

          <p class="pagina-erro__texto">
            Pode ser um endereço digitado errado, ou um link antigo que
            mudou de lugar. Os doces continuam aqui.
          </p>

          <div class="pagina-erro__acoes">
            <a href="./produtos.html" class="btn btn--primario btn--grande">
              Ver nossos doces
            </a>
            <a href="./index.html" class="btn btn--secundario">
              Voltar ao início
            </a>
            <a href="#" data-whatsapp="geral" class="btn btn--whatsapp">
              Falar no WhatsApp
            </a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="rodape"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
