<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Estoque | Admin Doce Fefê.21</title>
  <meta name="description" content="Entradas, saídas e alertas.">

  <!-- O painel NUNCA deve ser indexado por buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">
  <main id="conteudo">

    <!--
      ⚠️ O acesso é decidido no servidor: toda rota /api/admin/* passa por
      `exigirAdmin`. Esta página é apenas a interface.
    -->
    <div data-admin-login hidden></div>

    <div class="admin-painel" data-admin-painel hidden>
      <div data-admin-topo></div>

      <div class="admin-conteudo">

        <div class="admin-barra">
          <div class="admin-busca">
            <label class="visualmente-oculto" for="busca-estoque">Buscar produto</label>
            <input type="search" id="busca-estoque" class="campo__controle"
                   placeholder="Buscar pelo nome…" data-busca autocomplete="off">
          </div>
        </div>

        <!--
          O saldo mostrado é o DISPONÍVEL: o que existe menos o que já está
          reservado para pedidos em andamento. É esse número que decide se a
          loja consegue aceitar mais um pedido.
        -->
        <div class="mt-6" data-lista-estoque></div>

      </div>
    </div>

  </main>

  <script type="module" src="../js/admin/estoque.js"></script>
</body>
</html>
