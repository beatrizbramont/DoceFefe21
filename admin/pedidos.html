<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Pedidos | Admin Doce Fefê.21</title>
  <meta name="description" content="Conferência de pedidos e comprovantes.">

  <!-- O painel NUNCA deve ser indexado por buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/produtos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">
  <main id="conteudo">

    <!--
      Login, cabeçalho e menu são montados por js/admin/sessao.js, igual ao
      cabeçalho do site público. Com cinco telas administrativas, manter esse
      HTML copiado em cada arquivo garantiria que uma delas ficasse para trás.

      As DUAS áreas começam escondidas. Quem já está logada troca de aba sem
      ver o login piscar; quem não está vê o formulário no instante seguinte.
      Mostrar o login por padrão custava um susto a cada navegação.

      ⚠️ Esconder o painel é conveniência, não segurança. A barreira real está
      no servidor: toda rota /api/admin/* confere o perfil no banco.
    -->
    <div data-admin-login hidden></div>

    <div class="admin-painel" data-admin-painel hidden>
      <div data-admin-topo></div>

      <div class="admin-conteudo">

        <!-- Contadores -->
        <div class="admin-metricas" data-resumo-admin></div>

        <!-- Filtros -->
        <div class="filtros-categorias mt-6" data-filtros-admin
             role="group" aria-label="Filtrar pedidos"></div>

        <!-- Lista de pedidos -->
        <div class="mt-6" data-lista-admin></div>

      </div>
    </div>

  </main>

  <script type="module" src="../js/admin/pedidos.js"></script>
</body>
</html>
