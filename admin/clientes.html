<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Clientes | Admin Doce Fefê.21</title>
  <meta name="description" content="Cadastros de clientes.">

  <!-- O painel NUNCA deve ser indexado por buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">
  <main id="conteudo">

    <!--
      ⚠️ Esta tela mostra DADO PESSOAL: nome, e-mail, telefone e histórico de
      compras. A rota que alimenta a lista exige perfil de administrador no
      servidor, e a visão do banco é fechada para qualquer outra chave.
    -->
    <div data-admin-login></div>

    <div class="admin-painel" data-admin-painel hidden>
      <div data-admin-topo></div>

      <div class="admin-conteudo">

        <div class="admin-barra">
          <div class="admin-busca">
            <label class="visualmente-oculto" for="busca-cliente">Buscar cliente</label>
            <input type="search" id="busca-cliente" class="campo__controle"
                   placeholder="Buscar por nome ou e-mail…" data-busca autocomplete="off">
          </div>

          <div class="campo sem-margem">
            <label class="visualmente-oculto" for="ordem-clientes">Ordenar por</label>
            <select id="ordem-clientes" class="campo__controle" data-ordem>
              <option value="recentes">Mais recentes</option>
              <option value="compras">Quem mais comprou</option>
              <option value="nome">Nome (A–Z)</option>
            </select>
          </div>
        </div>

        <div class="admin-metricas mt-5" data-resumo-clientes></div>

        <div class="mt-6" data-lista-clientes></div>

      </div>
    </div>

  </main>

  <script type="module" src="../js/admin/clientes.js"></script>
</body>
</html>
