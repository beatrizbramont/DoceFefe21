<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Produtos | Admin Doce Fefê.21</title>
  <meta name="description" content="Cadastro de produtos, preços e fotos.">

  <!-- O painel NUNCA deve ser indexado por buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <!-- produtos.css traz os chips de filtro, reaproveitados aqui. -->
  <link rel="stylesheet" href="../css/produtos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">
  <main id="conteudo">

    <!--
      ⚠️ O acesso é decidido no servidor, não aqui: toda rota /api/admin/*
      passa por `exigirAdmin`, que confere o perfil no banco. Esta página é
      apenas a interface.
    -->
    <div data-admin-login hidden></div>

    <div class="admin-painel" data-admin-painel hidden>
      <div data-admin-topo></div>

      <div class="admin-conteudo">

        <div class="admin-barra">
          <div class="admin-busca">
            <label class="visualmente-oculto" for="busca-produto">Buscar produto</label>
            <input type="search" id="busca-produto" class="campo__controle"
                   placeholder="Buscar pelo nome…" data-busca autocomplete="off">
          </div>

          <button type="button" class="btn btn--primario" data-novo-produto>
            + Novo produto
          </button>
        </div>

        <!-- Situação: publicados, rascunhos, arquivados -->
        <div class="filtros-categorias mt-4" data-filtros-situacao
             role="group" aria-label="Filtrar por situação"></div>

        <!-- Formulário de cadastro e edição (aberto sob demanda) -->
        <div data-area-formulario></div>

        <!-- Lista de produtos -->
        <div class="mt-6" data-lista-produtos></div>

      </div>
    </div>

  </main>

  <script type="module" src="../js/admin/produtos.js"></script>
</body>
</html>
