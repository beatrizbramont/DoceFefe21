<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4A2C18">

  <title>Parceiros | Admin Doce Fefê.21</title>
  <meta name="description" content="Aprovação de revendedores.">

  <!-- O painel administrativo NUNCA deve ser indexado por buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/global.css">
  <!-- produtos.css traz os chips de filtro, reaproveitados aqui. -->
  <link rel="stylesheet" href="../css/produtos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin">
  <main id="conteudo">

    <!--
      ⚠️ A TELA MAIS SENSÍVEL DO PAINEL

      Aprovar aqui libera preço de atacado para sempre, em todos os pedidos
      daquela conta. É a única ação do sistema que cria desconto permanente.

      O controle de acesso é do servidor: a rota PATCH /api/admin/revendedores
      passa por `exigirAdmin`, e a política RLS impede que o próprio
      candidato mude o status dele.
    -->
    <div data-admin-login hidden></div>

    <div class="admin-painel" data-admin-painel hidden>
      <div data-admin-topo></div>

      <div class="admin-conteudo">

        <div class="admin-barra">
          <div class="admin-busca">
            <label class="visualmente-oculto" for="busca-parceiro">Buscar parceiro</label>
            <input type="search" id="busca-parceiro" class="campo__controle"
                   placeholder="Buscar por nome, negócio ou cidade…"
                   data-busca autocomplete="off">
          </div>
        </div>

        <div class="admin-metricas mt-5" data-resumo-parceiros></div>

        <div class="filtros-categorias mt-6" data-filtros-status
             role="group" aria-label="Filtrar por situação"></div>

        <div class="mt-6" data-lista-parceiros></div>

      </div>
    </div>

  </main>

  <script type="module" src="../js/admin/revendedores.js"></script>
</body>
</html>
